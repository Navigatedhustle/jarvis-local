[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Demo's local-first HP executive assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "psycopg[binary,pool]>=3.2,<4",
  "msal>=1.31,<2", "python-multipart>=0.0.20", "tzdata>=2025.1",
  "twilio>=9,<10",
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
  "websockets>=15,<17",
  "cryptography>=50,<51",
  "playwright>=1.58,<2",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "playwright>=1.50"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
